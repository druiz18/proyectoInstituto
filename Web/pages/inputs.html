<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
            max-width: 400px;
        }
        input {
            margin-bottom: 10px;
            padding: 8px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <form>
        <input type="text" placeholder="input text">
        <input type="email" placeholder="input email">
        <input type="number" placeholder="input number">
        <input type="password" placeholder="input password">
        <input type="checkbox" placeholder="input checkbox">
        <input type="radio" placeholder="input radio">
        <input type="date" placeholder="input date">
        <input type="file" placeholder="input file">
        <input type="color" placeholder="input color">
        <input type="range" placeholder="input range">
        <input type="url" placeholder="input url">
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
