<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Formulario de registro</title>

    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <main class="contenedor">
      <section class="formulario-contenedor">
        <h1>Crear cuenta</h1>

        <p class="descripcion">Completa el formulario para registrarte.</p>

        <form id="formulario">
          <!-- Nombre -->

          <div class="campo">
            <label for="nombre"> Nombre incompleto </label>

            <input
              type="text"
              id="nombre"
              name="nombre"
              placeholder="Ej: Joe Doe"
              minlength="5"
              maxlength="20"
            />

            <small id="errorNombre" class="mensaje-error"></small>
          </div>

          <!-- Correo -->

          <div class="campo">
            <label for="correo"> Correo electrónico </label>

            <input
              type="email"
              id="correo"
              name="correo"
              placeholder="Ej: correo@email.com"
            />

            <small id="errorCorreo" class="mensaje-error"></small>
          </div>

          <!-- Edad -->

          <div class="campo">
            <label for="edad"> Edad </label>

            <input type="number" id="edad" name="edad" placeholder="Ej: 25" />

            <small id="errorEdad" class="mensaje-error"></small>
          </div>

          <!-- Contraseña -->

          <div class="campo">
            <label for="password"> Contraseña </label>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Mínimo 8 caracteres"
            />

            <small id="errorPassword" class="mensaje-error"></small>
          </div>

          <!-- Confirmar contraseña -->

          <div class="campo">
            <label for="confirmarPassword"> Confirmar contraseña </label>

            <input
              type="password"
              id="confirmarPassword"
              name="confirmarPassword"
              placeholder="Repita su contraseña"
            />

            <small id="errorConfirmarPassword" class="mensaje-error"></small>
          </div>

          <!-- Términos -->

          <div class="campo-checkbox">
            <input type="checkbox" id="terminos" name="terminos" />

            <label for="terminos"> Acepto los términos y condiciones </label>
          </div>

          <small id="errorTerminos" class="mensaje-error"></small>

          <!-- Botón -->

          <button type="submit" class="boton">Registrarse</button>

          <!-- Mensaje general -->

          <p id="mensajeFormulario" class="mensaje-formulario"></p>
        </form>
      </section>
    </main>

    <script src="js/script.js"></script>
  </body>
</html>
